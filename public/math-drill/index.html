<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>数学反应速度测试 · Math Speed Drill</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@300;400;500;600&display=swap">
<style>
/* Layout: single centred column; three states (start / drill / results) swapped by [hidden].
   Colours follow yunwustudio.com: white / #18181a page, coral #ff6b6b for anything "chosen".
   --ok / --slow / --miss are result colours and stay as they were; --vslow is the third tier.
   [hidden] must stay !important: .pad and .choices set display:grid, which would otherwise
   override the hidden attribute and show the keypad / options when they should be gone. */
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0}
:root{
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#ffffff; --surface:#ffffff; --fg:#111827; --text:#4b5563; --muted:#6b7280; --line:#e5e7eb; --sunk:#f3f4f6;
  --ok:#2f7d55; --slow:#2563a8; --miss:#c2561a; --vslow:#7b4bb7; --accent:#ff6b6b; --on-accent:#ffffff;
  --font-display:'Space Grotesk','Helvetica Neue',sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#18181a; --surface:#221f21; --fg:#f2f0f1; --text:#a8a3a5; --muted:#a8a3a5; --line:#333033; --sunk:#2a2729;
  --ok:#6ec898; --slow:#6fb3e8; --miss:#ef9053; --vslow:#b996e6; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#18181a; --surface:#221f21; --fg:#f2f0f1; --text:#a8a3a5; --muted:#a8a3a5; --line:#333033; --sunk:#2a2729;
  --ok:#6ec898; --slow:#6fb3e8; --miss:#ef9053; --vslow:#b996e6; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px 32px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
/* Space between the parts of each screen. The drill screen keeps its own tighter rhythm. */
#start,#done{display:flex;flex-direction:column;gap:24px}
#drill{display:flex;flex-direction:column;gap:10px}
h1{font-family:var(--font-body);font-size:1.875rem;font-weight:300;margin:0;text-align:center;
  color:var(--fg);text-wrap:balance;line-height:1.3}
@media (min-width:768px){h1{font-size:2.25rem}}
.intro{font-size:1.125rem;font-weight:300;line-height:1.8;color:var(--text);text-align:center;margin-bottom:12px}
.intro b{font-weight:500;color:var(--accent)}
h2{font-family:var(--font-body);font-size:1.1rem;font-weight:400;margin:0;color:var(--fg)}
p{margin:0}
.lede{color:var(--muted);font-size:.93rem}
.startbar{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.startbar .primary{width:100%}
/* Sections sit directly on the page background: no box, just a divider line above. */
.card{background:transparent;border:none;border-top:1px solid var(--line);border-radius:0;padding:20px 0 0;
  display:flex;flex-direction:column;gap:13px}
.grp{border-top:1px solid var(--line)}
.grp:first-child{border-top:none}
.ghd{width:100%;display:flex;align-items:center;gap:9px;padding:13px 2px;background:transparent;border:none;
  border-radius:0;color:var(--fg);font-size:.95rem;font-weight:500;text-align:left;line-height:1.35}
.ghd:hover{opacity:1}
.ghd:hover .gnm{color:var(--accent)}
.ghd .chev{flex:0 0 12px;color:var(--muted);font-size:1.15rem;line-height:1;transition:transform .15s}
.ghd[aria-expanded="true"] .chev{transform:rotate(90deg)}
.ghd .gnm{min-width:0;transition:color .15s}
.ghd .gst{flex:0 0 auto;font-size:.7rem;font-weight:500;color:var(--muted);border:1px solid var(--line);
  border-radius:999px;padding:1px 8px;white-space:nowrap}
.ghd .gct{flex:0 0 auto;margin-left:auto;font-size:.78rem;font-weight:400;color:var(--muted);white-space:nowrap;
  font-variant-numeric:tabular-nums}
.ghd .gct.on{color:var(--accent)}
.gbody{padding:0 0 10px 21px}
.gtools{display:flex;justify-content:flex-end}
.gall{font-size:.72rem;font-weight:500;padding:3px 10px;border-radius:999px;background:transparent;
  color:var(--accent);border:1px solid var(--line)}
.mods{display:flex;flex-direction:column;gap:0}
.mod{display:flex;gap:12px;align-items:flex-start;padding:11px 2px;cursor:pointer}
.mod input{margin:3px 0 0;width:18px;height:18px;flex:0 0 auto;accent-color:var(--accent);cursor:pointer}
.mod .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.mod .nm{font-weight:500;font-size:.95rem;color:var(--muted);transition:color .15s}
.mod input:checked + .t .nm{color:var(--fg)}
.mod .nm .eg{font-family:var(--font-display);color:var(--muted);font-weight:500;margin-left:7px}
.mod input:checked + .t .nm .eg{color:var(--accent)}
.mod .d{font-size:.83rem;color:var(--muted);font-weight:300}
.seg{display:flex;gap:6px;background:var(--sunk);padding:4px;border-radius:11px}
.seg button{flex:1;padding:9px 6px;font-size:.88rem;font-weight:400;border-radius:8px;background:transparent;color:var(--muted);border:none}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.09)}
button{font-family:var(--font-body);font-size:1rem;font-weight:500;border-radius:10px;cursor:pointer;
  border:1px solid transparent;padding:13px 20px;transition:opacity .15s}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:hover{opacity:.88}
button:disabled{opacity:.4;cursor:not-allowed}
.primary{background:var(--accent);color:var(--on-accent);border-radius:999px;font-size:1.05rem}
.ghost{background:transparent;color:var(--fg);border-color:var(--line);border-radius:999px}
.rail{height:4px;background:var(--line);border-radius:99px;overflow:hidden}
.rail i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.counter{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);
  font-variant-numeric:tabular-nums;letter-spacing:.04em;text-transform:uppercase}
.q{font-family:var(--font-display);font-weight:700;font-size:clamp(2.1rem,10vw,3.4rem);
  text-align:center;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15;margin:14px 0 2px;
  overflow-wrap:break-word}
.q.long{font-size:clamp(1.2rem,5.2vw,1.7rem);letter-spacing:0;line-height:1.35;margin-top:18px}
.qhint{text-align:center;font-size:.85rem;color:var(--muted);min-height:1.3em}
#ans{width:100%;font-family:var(--font-display);font-weight:700;font-size:2.3rem;text-align:center;
  background:transparent;color:var(--fg);border:none;border-bottom:3px solid var(--line);
  padding:6px 0 10px;font-variant-numeric:tabular-nums;border-radius:0}
#ans:focus{outline:none;border-bottom-color:var(--accent)}
.pulse-ok{border-bottom-color:var(--ok)!important}
.pulse-miss{border-bottom-color:var(--miss)!important}
.hint{text-align:center;font-size:.82rem;color:var(--muted)}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.opt{font-family:var(--font-display);font-weight:700;font-size:1.5rem;padding:18px 10px;
  background:var(--surface);color:var(--fg);border:1.5px solid var(--line);border-radius:12px;
  display:flex;align-items:center;justify-content:center;gap:9px}
.opt .k{font-family:var(--font-body);font-size:.72rem;font-weight:600;color:var(--muted);
  border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.opt.hit{border-color:var(--ok);color:var(--ok)}
.opt.no{border-color:var(--miss);color:var(--miss)}
.choices.long{grid-template-columns:1fr}
.choices.long .opt{font-size:1.08rem;padding:14px 13px;justify-content:flex-start;text-align:left}
.score{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.tile{border:1px solid var(--line);border-radius:12px;padding:13px;display:flex;flex-direction:column;gap:2px}
.tile .n{font-family:var(--font-display);font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.tile .l{font-size:.79rem;color:var(--muted)}
.weak{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-family:var(--font-display);font-weight:700;font-size:1.02rem;font-variant-numeric:tabular-nums;
  padding:6px 11px;border-radius:9px;border:1.5px solid;max-width:100%;overflow-wrap:anywhere}
.chip.slow{color:var(--slow);border-color:var(--slow)}
.chip.miss{color:var(--miss);border-color:var(--miss)}
.chip.vslow{color:var(--vslow);border-color:var(--vslow)}
.tag.vslow{color:var(--vslow)}
/* One-click presets */
.presets{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.preset{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:13px 14px;
  background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:12px;transition:border-color .15s}
.preset:hover{border-color:var(--accent);opacity:1}
.preset .pn{font-size:.95rem;font-weight:500}
.preset .ps{font-size:.78rem;font-weight:300;color:var(--muted);line-height:1.4}
/* Number pad */
.toolrow{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
.padtoggle{font-size:.8rem;font-weight:500;padding:6px 14px;border-radius:999px;
  background:transparent;color:var(--muted);border:1px solid var(--line)}
.padtoggle[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;user-select:none;-webkit-user-select:none}
.pad button{font-family:var(--font-display);font-size:1.6rem;font-weight:700;padding:0;min-height:56px;
  background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.pad button:active{background:var(--sunk)}
.pad .enter{background:var(--accent);color:var(--on-accent);border-color:transparent;
  font-family:var(--font-body);font-size:1.15rem;font-weight:500}
/* Speed chart */
.speed svg{display:block}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.bar .bn{font-size:.88rem;font-weight:500}
.bar .bv{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar .tr{grid-column:1/-1;height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:99px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.73rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td.num{font-variant-numeric:tabular-nums;font-family:var(--font-display);font-weight:500}
.tag{font-size:.78rem;font-weight:600}
.tag.ok{color:var(--ok)} .tag.slow{color:var(--slow)} .tag.miss{color:var(--miss)}
.row{display:flex;gap:12px;flex-wrap:wrap;padding-top:8px}
.row>button{flex:1 1 auto;white-space:nowrap;padding:12px 22px}
.save{font-size:.82rem;color:var(--muted);text-align:center}
.hhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.hhead button{font-size:.75rem;font-weight:500;padding:4px 10px;border-radius:999px;background:transparent;
  color:var(--muted);border:1px solid var(--line)}
.spark{display:flex;align-items:flex-end;gap:5px;height:42px}
.spark div{flex:1;max-width:30px;background:var(--accent);border-radius:3px 3px 0 0;min-height:3px;opacity:.5}
.spark div:last-child{opacity:1}
.last{font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.last b{color:var(--fg)}
</style>
</head>
<body>

<div class="wrap">

  <section id="start">
    <h1 data-i="title"></h1>
    <p class="intro" data-ih="intro"></p>

    <div class="card">
      <h2 data-i="quick"></h2>
      <div class="presets" id="presets"></div>
    </div>

    <div class="card" id="hist" hidden>
      <div class="hhead"><h2 data-i="history"></h2><button type="button" id="clear" data-i="clear"></button></div>
      <div class="spark" id="spark"></div>
      <p class="last" id="lastline"></p>
      <div id="watchWrap" hidden>
        <h2 id="watchTitle" style="margin-top:6px"></h2>
        <div class="weak" id="watchList" style="margin:9px 0"></div>
        <p class="lede" data-i="watchNote"></p>
        <button class="ghost" id="goWatch" style="width:100%;margin-top:11px" data-i="goWatch"></button>
      </div>
    </div>

    <div class="card">
      <h2 data-i="which"></h2>
      <div class="mods" id="mods"></div>
    </div>

    <div class="card">
      <h2 data-i="howMany"></h2>
      <div class="seg" id="len">
        <button data-n="20" aria-pressed="true" data-i="len20"></button>
        <button data-n="40" aria-pressed="false" data-i="len40"></button>
        <button data-n="0" aria-pressed="false" data-i="lenAll"></button>
      </div>
      <p class="lede" id="pool">—</p>
    </div>

    <div class="startbar">
      <button class="primary" id="go" data-i="go"></button>
      <p class="lede" data-ih="timing"></p>
    </div>
  </section>

  <section id="drill" hidden>
    <div class="rail"><i id="bar"></i></div>
    <div class="counter"><span id="count"></span><span id="modnow"></span></div>
    <div class="q" id="q"></div>
    <p class="qhint" id="qhint"></p>
    <input id="ans" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="choices" id="choices" hidden></div>
    <p class="hint" id="hintline"></p>
    <div class="toolrow">
      <button type="button" class="padtoggle" id="autoToggle" aria-pressed="true" hidden></button>
      <button type="button" class="padtoggle" id="padToggle" aria-pressed="false" hidden data-i="padToggle"></button>
    </div>
    <div class="pad" id="pad" hidden></div>
  </section>

  <section id="done" hidden>
    <h1 data-i="yourList"></h1>
    <div class="score">
      <div class="tile"><span class="n" id="nSolid" style="color:var(--ok)">0</span><span class="l" data-i="solid"></span></div>
      <div class="tile"><span class="n" id="nWeak" style="color:var(--slow)">0</span><span class="l" data-i="toPractice"></span></div>
    </div>
    <div class="card">
      <h2 data-i="speedTitle"></h2>
      <div class="speed" id="speed"></div>
      <p class="lede" id="speedNote"></p>
    </div>
    <div class="card">
      <h2 id="weakTitle"></h2>
      <div class="weak" id="weakList"></div>
      <p class="lede" id="weakNote"></p>
    </div>
    <div class="card">
      <h2 data-i="byCat"></h2>
      <div class="bars" id="bars"></div>
    </div>
    <div class="card">
      <h2 data-i="detail"></h2>
      <div class="tblwrap"><table>
        <thead><tr><th data-i="thQ"></th><th data-i="thA"></th><th data-i="thT"></th><th data-i="thV"></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table></div>
    </div>
    <div class="row">
      <button class="primary" id="again" data-i="again"></button>
      <button class="ghost" id="onlyWeak" data-i="onlyWeak"></button>
      <button class="ghost" id="back" data-i="back"></button>
    </div>
    <p class="save" id="saveMsg"></p>
  </section>

</div>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};

  /* ---------- language ----------
     ?lang=en|zh wins; otherwise the site's saved choice (same origin, key "language");
     otherwise the browser language. The site page also sends {type:'math-drill:lang'} on toggle. */
  var LANG=(function(){
    var q=(location.search.match(/[?&]lang=(en|zh)\b/)||[])[1];
    if(q) return q;
    try{ var s=localStorage.getItem('language'); if(s==='en'||s==='zh') return s }catch(e){}
    return /^zh/i.test(navigator.language||'') ? 'zh' : 'en';
  })();
  function L(zh,en){return {zh:zh,en:en}}
  function T(v){return v!==null && typeof v==='object' ? v[LANG] : v}   // text to show
  function K(v){return v!==null && typeof v==='object' ? v.zh : v}      // stable key (saved records)

  var S={
    title:L('数学反应速度测试','Math Reaction Speed Test'),
    intro:L('测的不是会不会，是<b>快不快</b>。算得出来但要想 5 秒，在考场上就是慢、中途容易算错、注意力被从题目抽走。',
            'It tests not whether you can, but <b>how fast</b>. If you can work it out but need 5 seconds, on a test that means slow, more slips along the way, and attention pulled off the problem.'),
    history:L('记录','History'), clear:L('清除记录','Clear history'), clearSure:L('再点一次确认清除','Click again to clear'),
    watchNote:L('连续两次在时限内答对，就自动从这里划掉。','Get one right within the time limit twice in a row and it drops off this list.'),
    goWatch:L('只练盯着的这些','Practice only these'),
    which:L('测哪几类','Categories'), toggleAll:L('全选 / 全不选','All / none'),
    howMany:L('题数','Questions'), len20:L('快测 20 题','Quick 20'), len40:L('40 题','40'), lenAll:L('全部','All'),
    go:L('开始','Start'),
    timing:L('计时从题目出现算到你按下<b>第一个字符</b>，不算打字时间。','Timing runs from when the question appears to your <b>first keystroke</b>, so typing time doesn’t count.'),
    yourList:L('你的清单','Your list'), solid:L('稳','Solid'), toPractice:L('要练','To practice'),
    byCat:L('各类表现','By category'), detail:L('全部明细','All answers'),
    thQ:L('题','Question'), thA:L('你的答案','Your answer'), thT:L('反应','Reaction'), thV:L('判定','Result'),
    again:L('再测一次','Test again'), onlyWeak:L('只测要练的','Practice weak ones'), back:L('换类别','Change categories'),
    answer:L('答案','Answer'),
    choiceHint:L('点一个，或按 1–4','Tap one, or press 1–4'),
    typeHint:L('答对自动跳下一题 · 答错按 Enter · 负号用 <b>-</b>，小数用 <b>.</b>，分数用 <b>/</b>','Right answers move on by themselves · press Enter to give up on a wrong one · use <b>-</b> for negatives, <b>.</b> for decimals, <b>/</b> for fractions'),
    tagOk:L('稳','Solid'), tagSlow:L('慢','Slow'), tagVslow:L('很慢','Very slow'), tagMiss:L('错','Wrong'),
    quick:L('快捷组合','Quick sets'),
    padToggle:L('数字键盘','Number pad'),
    typeHintManual:L('按 Enter 提交 · 负号用 <b>-</b>，小数用 <b>.</b>，分数用 <b>/</b>','Press Enter to submit · use <b>-</b> for negatives, <b>.</b> for decimals, <b>/</b> for fractions'),
    typeHintPadManual:L('点 ✓ 提交 · 也可以按 Enter','Tap ✓ to submit · Enter works too'),
    autoOn:L('⏩ 答对自动跳','⏩ Auto-advance when right'), autoOff:L('⏸ 手动按 Enter','⏸ Manual: press Enter'),
    typeHintPad:L('答对自动跳下一题 · 答错点 ✓','Right answers move on by themselves · tap ✓ to give up on a wrong one'),
    speedTitle:L('平均反应速度','Average reaction time'),
    saved:L('已记在这台设备的浏览器里 ✓','Saved in this browser on this device ✓'),
    noSave:L('这个浏览器不让存记录（可能是无痕模式）。','This browser won’t save records (it may be in private mode).'),
    noneTitle:L('没有要练的','Nothing to practice'),
    noneNote:L('全部在时限内答对。这几类不是你的瓶颈，把时间挪给三角。','All correct within the time limit. These aren’t your bottleneck, so spend the time on trig instead.'),
    pickOne:L('至少选一类','Pick at least one category')
  };
  function s(key){ return T(S[key]) }
  var txt={
    count:function(i,n){return LANG==='zh'?'第 '+i+' / '+n+' 题':'Question '+i+' / '+n},
    pool:function(c,p,n){return LANG==='zh'?'选中 '+c+' 类，题库共 '+p+' 题，这次抽 '+n+' 题':c+' categories · '+p+' questions in the bank · '+n+' this round'},
    grpCount:function(n,m){return LANG==='zh'?'已开 '+n+' / 共 '+m:n+' / '+m+' on'},
    watch:function(n){return LANG==='zh'?'盯着的 '+n+' 个':'Watching '+n},
    weakTitle:function(n){return LANG==='zh'?'要练的 '+n+' 个':n+' to practice'},
    weakNote:function(n,v){return LANG==='zh'
      ?'橙框 = 答错，紫框 = 答对但超过时限一倍（'+v+' 个），蓝框 = 答对但想得太久（'+n+' 个），按慢的程度排序。每天先考这几个，连着两天在时限内答对就划掉。'
      :'Orange = wrong, purple = right but over twice the time limit ('+v+'), blue = right but too slow ('+n+'), slowest first. Test these first each day; two days in a row within the time limit and they’re crossed off.'},
    speedNote:function(cur,hist,n){

  /* ---------- adaptive picking ----------
     Each question keeps its last 12 attempts. Recent attempts count more (×0.8 per step back).
     Per attempt: fast & right (≤60% of the limit) 0.25 · right 0.4 · slow 3 · very slow 5 · wrong 10.
     Floor MIN_W = 0.7 was tuned by simulation (4000 rounds, default pool of 264): a mastered question
     still appears in ~5% of 20-question rounds (an unseen one: ~7.6%), so a skill
     that slips still gets caught; untouched for 14+ days, it goes back to "never seen" (1).
     Never seen = 1. So 3 × 11 answered in 1.2 s comes back only now and then (~5% of rounds), and 9 × 7 missed twice
     scores 10 and is always pulled in (up to 40% of a round is reserved for scores ≥ 5). */
  var HIST_N=12, MUST=5;

    return Math.max(MIN_W,rawWeight(it,th));

  function rawWeight(it,th){

               .sort(function(a,b){return b.w-a.w}).slice(0,Math.ceil(n*0.4));

    var max=Math.max.apply(null,series.map(function(r){return r.avgMs}).concat([hist||0]))*1.12;
    var slot=W/Math.max(series.length,6), bw=Math.min(34,slot*0.62);

      d.style.height=Math.max(3,Math.round(r.solid/r.total*42))+'px';
      d.title=r.at.slice(0,10)+'  '+r.solid+'/'+r.total;
      sp.appendChild(d);
    });

    var last=st.runs[st.runs.length-1], line=$('lastline'); line.textContent='';
    var b=document.createElement('b'); b.textContent=last.solid+' / '+last.total;
    line.appendChild(document.createTextNode(txt.last(last.at.slice(5,10))));
    line.appendChild(b);
    line.appendChild(document.createTextNode(txt.lastTail(st.runs.length)));

    var w=watched(st), wrap=$('watchWrap'), wl=$('watchList');
    if(!w.length){ wrap.hidden=true; return }
    wrap.hidden=false;
    $('watchTitle').textContent=txt.watch(w.length);
    w.sort(function(a,c){ return st.items[c].fail-st.items[a].fail });
    wl.textContent='';
    var A=allQ();
    w.forEach(function(k){
      var it=st.items[k], c=document.createElement('span');
      c.className='chip '+(it.streak===1?'slow':'miss');
      c.textContent=T(A[k].t)+(it.streak===1?'  ①':'');
      c.title=txt.chipTitle(it.fail,it.streak);
      wl.appendChild(c);
    });
  }
  $('clear').addEventListener('click',function(){
    if(this.dataset.armed){ try{ localStorage.removeItem(KEY) }catch(e){}
      this.textContent=s('clear'); delete this.dataset.armed; renderHistory(); return }
    this.dataset.armed='1'; this.textContent=s('clearSure');
    var btn=this; setTimeout(function(){ btn.textContent=s('clear'); delete btn.dataset.armed },4000);
  });
  $('goWatch').addEventListener('click',function(){
    var st=loadStore(), A=allQ(), list=watched(st).map(function(k){return A[k]});
    if(list.length) begin(list,0);
  });

  $('go').addEventListener('click',function(){ cur={keys:null,n:nWanted}; begin(pool(),nWanted,true) });
  $('again').addEventListener('click',function(){ begin(pool(cur.keys),cur.n,true) });
  $('back').addEventListener('click',function(){ secDone.hidden=true; secStart.hidden=false; toTop(); refresh(); renderHistory() });
  $('onlyWeak').addEventListener('click',function(){
    var w=weakOf().map(function(r){return r.q});
    w.length ? begin(w,0) : begin(pool(cur.keys),cur.n,true);
  });

  /* ---------- switching language without losing progress ---------- */
  function setLang(l){
    if((l!=='en'&&l!=='zh') || l===LANG) return;
    LANG=l;
    applyStatic(); pickerText(); refresh();
    try{ renderHistory() }catch(e){ $('hist').hidden=true }
    if(!secDrill.hidden && qs[idx] && !busy) questionText();
    if(!secDone.hidden) results();
  }
  window.addEventListener('message',function(e){
    if(e.origin!==location.origin || !e.data || e.data.type!=='math-drill:lang') return;
    setLang(e.data.lang);
  });
  window.addEventListener('storage',function(e){ if(e.key==='language') setLang(e.newValue) });

  applyStatic(); pickerText(); refresh();
  try{ renderHistory() }catch(e){ $('hist').hidden=true }

  // Read-only hooks for checking the drill from a test script.
  window.__mathDrill={weight:weight, pickAdaptive:pickAdaptive, parseAns:parseAns,
    banks:function(){ return MODS.map(function(m){ return {k:m.k, on:m.on, th:m.th, qs:m.bank()} }) }};
})();
</script>
