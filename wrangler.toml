# Cloudflare Pages configuration for yun-wu-portfolio
name = "yun-wu-portfolio"
compatibility_date = "2024-12-01"
pages_build_output_dir = "dist"

# R2 bucket binding for photography images
[[r2_buckets]]
binding = "PHOTOGRAPHY"
bucket_name = "photography"
remote = true

# Workers AI binding for chat
[ai]
binding = "AI"

# KV namespace for chat logs
[[kv_namespaces]]
binding = "CHAT_LOGS"
id = "5548d4d1168b40ea8606515d263233ca"
